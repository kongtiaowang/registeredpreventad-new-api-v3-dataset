# DataLad provider for the PREVENT-AD registered LORIS API.
# Tokens are generated from the LORIS login endpoint and stored in the
# user's credential store, never in this repository.
[provider:registeredpreventad]
url_re = https://registeredpreventad(?:-new)?\.loris\.ca/api/v0\.0\.3/.*
authentication_type = loris-token
credential = registeredpreventad

[credential:registeredpreventad]
url = https://registeredpreventad-new.loris.ca/api/v0.0.3/login
type = loris-token
